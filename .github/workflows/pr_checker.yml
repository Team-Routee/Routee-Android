name: PR Checker

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing config
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_STORE_PASSWORD: ${{ secrets.DEBUG_STORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > keystore/routee-debug-key.jks
          {
            echo "debug.store.password=$DEBUG_STORE_PASSWORD"
            echo "debug.key.alias=$DEBUG_KEY_ALIAS"
            echo "debug.key.password=$DEBUG_KEY_PASSWORD"
            echo "release.store.password=unused"
            echo "release.key.alias=unused"
            echo "release.key.password=unused"
          } > local.properties

      - name: Build
        run: ./gradlew assembleDebug
